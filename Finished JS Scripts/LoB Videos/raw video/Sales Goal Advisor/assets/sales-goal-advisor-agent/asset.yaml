apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: sales-goal-advisor-agent
  version: "1.0.0"

provides:
  apis:
    - name: sales-goal-advisor-agent
      kind: a2a
      ordId: customer.build:apiResource:sales-goal-advisor-e1d3e.sales-goal-advisor-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-sf-ec-employee-profile-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-goal-advisor-e1d3e.sap-sf-ec-employee-profile-mcp-server:v1
  - name: sap-sf-performance-and-goals-pmgm-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-goal-advisor-e1d3e.sap-sf-performance-and-goals-pmgm-mcp-server:v1
  - name: sap-sf-pmgm-continuous-performance-management-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-goal-advisor-e1d3e.sap-sf-pmgm-continuous-performance-management-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
